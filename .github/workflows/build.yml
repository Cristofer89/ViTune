name: Build APK

on:
  push:
    branches: [ patch-1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug -Pchaquopy.python=/opt/hostedtoolcache/Python/3.12.9/x64/bin/python3 -Porg.gradle.java.installations.auto-download=true --no-daemon
        env:
          PYTHON3: /opt/hostedtoolcache/Python/3.12.9/x64/bin/python3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
